name: NFL Unified SSOT CI
on:
  push:
    branches: ["repair/unified-brain-v8-ssot-v1"]
  pull_request:
    paths:
      - "brain-elite-v8.js"
      - "patches/**"
      - "tests/**"
      - "migrations/**"
      - ".github/workflows/nfl-unified-ssot-ci.yml"
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply unified SSOT candidate patch
        run: git apply --check patches/unified-brain-v8-ssot-v1.patch && git apply patches/unified-brain-v8-ssot-v1.patch
      - name: Syntax check unified Worker
        run: node --check brain-elite-v8.js
      - name: Run regression + SSOT contracts
        run: node --test tests/*.test.mjs
      - name: Validate D1 migration
        run: sqlite3 :memory: < migrations/0001_nfl_ssot.sql
      - name: Build deploy artifact
        run: |
          mkdir -p dist
          cp brain-elite-v8.js dist/NFL_Brain_v8_Unified_SSOT_v1.js
          cp migrations/0001_nfl_ssot.sql dist/0001_nfl_ssot.sql
          cp README-UNIFIED-SSOT.md dist/README-UNIFIED-SSOT.md
      - uses: actions/upload-artifact@v4
        with:
          name: RTP-NFL-Unified-Brain-v8-SSOT-v1
          path: dist/
          if-no-files-found: error
