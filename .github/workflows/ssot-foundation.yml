name: SSOT Foundation

on:
  push:
    branches:
      - repair/ssot-foundation-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply reviewed SSOT patch if needed
        shell: bash
        run: |
          set -euo pipefail
          if git apply --check patches/ssot-foundation-v1.patch; then
            git apply patches/ssot-foundation-v1.patch
            echo "Applied SSOT foundation patch."
          else
            echo "Patch already applied or source no longer matches; continuing to verification."
          fi

      - name: Syntax check
        run: node --check brain-elite-v8.js

      - name: SSOT regression checks
        run: node tests/ssot-foundation.test.cjs

      - name: Commit verified Worker repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add brain-elite-v8.js
          if git diff --cached --quiet; then
            echo "No Worker changes to commit."
            exit 0
          fi
          git commit -m "Apply verified SSOT foundation repairs"
          git push origin HEAD:repair/ssot-foundation-v1
